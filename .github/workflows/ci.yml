name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: unit tests
        run: npx vitest run

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: build produced the expected pages
        run: |
          test -s dist/site/index.html
          test -s dist/site/play/blackout/index.html
      - name: single-file build
        run: npm run build:standalone
      - uses: actions/upload-artifact@v4
        with:
          name: watchfloor-site
          path: dist/site

  smoke:
    name: browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ensure a headless browser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || true
      - run: node scripts/smoke.mjs
        env:
          PORT: '8123'
