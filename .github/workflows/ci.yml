name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # There are no dependencies, so there is nothing to install.
      - run: node --test test/*.test.js

  bundle:
    name: single-file bundle builds and is standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/bundle.mjs
      - name: bundle must not contain module syntax
        run: |
          if grep -q 'type="module"' dist/grid-defense-command.html; then
            echo "bundle still references modules"; exit 1
          fi
          test -s dist/grid-defense-command.html
      - uses: actions/upload-artifact@v4
        with:
          name: grid-defense-command-single-file
          path: dist/grid-defense-command.html

  smoke:
    name: browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ensure a headless browser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || true
      - run: node scripts/smoke.mjs
        env:
          PORT: '8123'
